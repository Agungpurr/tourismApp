name: tourism_app
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.2.1 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cached_network_image: ^3.3.0 # Add this for better image handling
  connectivity_plus: ^5.0.1 # Add this for network connectivity check

dev_dependencies:
  flutter_test:
    sdk: flutter

  cupertino_icons: ^1.0.8

  provider: ^6.1.5+1
  flutter_lints: ^2.0.0
  http: ^1.2.0

flutter:
  uses-material-design: true

  fonts:
    - family: IBMPlexSansCondensed # Fixed typo: was IBMPXlexSansCondensed
      fonts:
        - asset: assets/fonts/IBMPlexSansCondensed-Bold.ttf
          weight: 700
        - asset: assets/fonts/IBMPlexSansCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansCondensed-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansCondensed-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansCondensed-Light.ttf
          weight: 300
        - asset: assets/fonts/IBMPlexSansCondensed-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/IBMPlexSansCondensed-Thin.ttf
          weight: 100
